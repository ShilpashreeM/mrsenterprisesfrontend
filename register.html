<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | MRS Enterprises</title>

    <link rel="icon" type="image/png" href="images/MRS.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="footer.css">
</head>

<body>

<header class="menu">
    <img src="images/MRS.png" class="logo" alt="Company Logo">

    <nav class="desktop-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="products.html">Our Products</a>
        <a href="contact.html">Contact Us</a>
    </nav>

    <div class="hamburger" onclick="openMenu()">&#9776;</div>
</header>

<div id="mobileMenu" class="mobile-menu">
    <div class="mobile-menu-header">
        <img src="images/MRS.png" class="mobile-logo">
        <span class="close-btn" onclick="closeMenu()">✕</span>
    </div>

    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="products.html">Our Products</a>
    <a href="contact.html">Contact Us</a>
</div>


<section class="auth-section">

    <div class="auth-card">

        <div class="auth-logo">
            <img src="images/MRS.png" alt="MRS Enterprises">
        </div>

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Create your MRS Enterprises customer account
        </p>

        <form id="register-form">

            <div class="auth-field">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>


            <div class="auth-field">
                <label for="phone">Phone</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>


            <div class="auth-field">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                >
            </div>


            <div class="auth-field">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
            </div>


            <button
                type="submit"
                class="auth-submit-btn"
            >
                Create Account
            </button>

        </form>


        <p
            id="register-message"
            class="auth-message"
        ></p>


        <p class="auth-switch">
            Already have an account?

            <a href="login.html">
                Login
            </a>
        </p>

    </div>

</section>


<div id="footer-placeholder"></div>


<script>
fetch("footer.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("footer-placeholder").innerHTML = html;
    });
</script>


<script src="api.js"></script>

<script>

const registerForm =
    document.getElementById("register-form");

const registerMessage =
    document.getElementById("register-message");


registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        registerMessage.textContent =
            "Creating your account...";


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/auth/register`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name,
                            phone,
                            email: email || undefined,
                            password
                        })
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Registration failed"
                );
            }


            registerMessage.textContent =
                "Account created successfully. Redirecting to login...";


            setTimeout(() => {

                window.location.href =
                    "login.html";

            }, 1000);


        } catch (error) {

            console.error(
                "Registration error:",
                error
            );

            registerMessage.textContent =
                error.message ||
                "Unable to create account.";
        }

    }
);


function openMenu() {

    document
        .getElementById("mobileMenu")
        .classList.add("open");
}


function closeMenu() {

    document
        .getElementById("mobileMenu")
        .classList.remove("open");
}

</script>

</body>
</html>
