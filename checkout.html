<script>

let cart = null;
let addresses = [];
let selectedAddressId = null;


/* ================================
   AUTH
================================ */

const token =
    localStorage.getItem("token");


if (!token) {

    window.location.href =
        "login.html?returnUrl=" +
        encodeURIComponent("checkout.html");

}


/* ================================
   LOAD CART
================================ */

async function loadCart() {

    try {

        const response =
            await fetch(
                `${API_BASE_URL}/cart`,
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Unable to load cart"
            );

        }


        cart =
            result.data ||
            result.cart ||
            result;


        if (
            !cart ||
            !cart.items ||
            cart.items.length === 0
        ) {

            window.location.href =
                "cart.html";

            return;

        }


        renderCartSummary();
        updatePlaceOrderButton();

    } catch (error) {

        console.error(
            "Load checkout cart error:",
            error
        );

        document.getElementById(
            "checkout-cart-summary"
        ).innerHTML = `
            <p>
                Unable to load cart.
            </p>
        `;

    }

}


/* ================================
   CART SUMMARY
================================ */

function renderCartSummary() {
    const container = document.getElementById(
        "checkout-cart-summary"
    );

    const subtotal = Number(cart.totalAmount || 0);
    const deliveryCharge = 1;
    const total = subtotal + deliveryCharge;

    container.innerHTML = `
        <div class="checkout-items">
            ${cart.items.map(item => `
                <div class="checkout-item">
                    <div>
                        <strong>${item.productId?.name || "Product"}</strong>
                        <small>Qty: ${item.quantity}</small>
                    </div>
                    <strong>₹${item.price * item.quantity}</strong>
                </div>
            `).join("")}
        </div>

        <hr>

        <div class="checkout-total-row">
            <span>Subtotal</span>
            <strong>₹${subtotal.toFixed(2)}</strong>
        </div>

        <div class="checkout-total-row">
            <span>Delivery</span>
            <strong>₹${deliveryCharge.toFixed(2)}</strong>
        </div>

        <div class="checkout-grand-total">
            <span>Total</span>
            <strong>₹${total.toFixed(2)}</strong>
        </div>
    `;
}

/* ================================
   LOAD ADDRESSES
================================ */

async function loadAddresses() {

    try {

        const response =
            await fetch(
                `${API_BASE_URL}/addresses`,
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Unable to load addresses"
            );

        }


        addresses =
            result.data ||
            result.addresses ||
            result ||
            [];


        if (!Array.isArray(addresses)) {
            addresses = [];
        }


        renderAddresses();


    } catch (error) {

        console.error(
            "Load addresses error:",
            error
        );

        document.getElementById(
            "address-list"
        ).innerHTML = `
            <p>
                Unable to load addresses.
            </p>
        `;

    }

}


/* ================================
   RENDER ADDRESSES
================================ */

function renderAddresses() {

    const container =
        document.getElementById(
            "address-list"
        );


    if (addresses.length === 0) {

        selectedAddressId = null;


        container.innerHTML = `

            <div class="no-address">

                <p>
                    You don't have a saved address.
                </p>

                <button
                    type="button"
                    class="add-address-btn"
                    onclick="showAddressForm()"
                >
                    Add Address
                </button>

            </div>

        `;

        updatePlaceOrderButton();

        return;
    }


    let defaultIndex =
        addresses.findIndex(
            address =>
                address.isDefault === true
        );


    if (defaultIndex === -1) {
        defaultIndex = 0;
    }


    selectedAddressId =
        addresses[defaultIndex]._id;


    container.innerHTML =
        addresses.map(
            (address, index) => `

                <label
                    class="address-option ${
                        index === defaultIndex
                            ? "selected"
                            : ""
                    }"
                >

                    <input
                        type="radio"
                        name="selectedAddress"
                        value="${address._id}"
                        ${
                            index === defaultIndex
                                ? "checked"
                                : ""
                        }
                        onchange="selectAddress('${address._id}')"
                    >

                    <div>

                        <strong>
                            ${address.name}
                        </strong>

                        <p>
                            ${address.phone}
                        </p>

                        <p>
                            ${address.addressLine1}
                            ${
                                address.addressLine2
                                    ? ", " +
                                      address.addressLine2
                                    : ""
                            }
                        </p>

                        <p>
                            ${address.city},
                            ${address.state}
                            - ${address.pincode}
                        </p>

                        ${
                            address.landmark
                                ? `<p>
                                    Landmark:
                                    ${address.landmark}
                                   </p>`
                                : ""
                        }

                        <span class="address-type">
                            ${address.addressType}
                        </span>

                    </div>

          <button
              type="button"
              class="delete-address-btn"
              onclick="deleteAddress(event, '${address._id}')"
              aria-label="Delete this address"
          >
              <svg
                  width="28"
                  height="28"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
              >
                  <path d="M3 6h18"></path>
                  <path d="M8 6V4h8v2"></path>
                  <path d="M19 6l-1 14H6L5 6"></path>
                  <path d="M10 11v5"></path>
                  <path d="M14 11v5"></path>
              </svg>
              <span>Delete</span>
          </button>

                </label>
            `
        )
        .join("");


    updatePlaceOrderButton();
}


/* ================================
   SELECT ADDRESS
================================ */

function toggleBillingAddress() {
    const sameAsShipping =
        document.getElementById("same-as-shipping").checked;

    document.getElementById("billing-address-form").style.display =
        sameAsShipping ? "none" : "block";
}


function getBillingAddress() {
    const sameAsShipping =
        document.getElementById("same-as-shipping").checked;

    if (sameAsShipping) {
        return null;
    }

    const billingAddress = {
        name: document.getElementById("billing-name").value.trim(),
        phone: document.getElementById("billing-phone").value.trim(),
        companyName: document.getElementById("billing-company").value.trim(),
        gstNumber: document.getElementById("billing-gst").value.trim().toUpperCase(),
        addressLine1: document.getElementById("billing-line1").value.trim(),
        addressLine2: document.getElementById("billing-line2").value.trim(),
        city: document.getElementById("billing-city").value.trim(),
        state: document.getElementById("billing-state").value.trim(),
        pincode: document.getElementById("billing-pincode").value.trim()
    };

    const requiredFields = [
        ["name", "Billing name"],
        ["phone", "Billing phone"],
        ["addressLine1", "Billing address line 1"],
        ["city", "Billing city"],
        ["state", "Billing state"],
        ["pincode", "Billing pincode"]
    ];

    for (const [field, label] of requiredFields) {
        if (!billingAddress[field]) {
            throw new Error(`${label} is required.`);
        }
    }

    return billingAddress;
}


function selectAddress(addressId) {

    selectedAddressId =
        addressId;


    document
        .querySelectorAll(".address-option")
        .forEach(option => {

            const radio =
                option.querySelector(
                    "input"
                );

            option.classList.toggle(
                "selected",
                radio.value === addressId
            );

        });


    updatePlaceOrderButton();
}


function showModal(title, message, type = "info") {
    const overlay = document.getElementById("mrs-modal-overlay");
    const titleElement = document.getElementById("mrs-modal-title");
    const messageElement = document.getElementById("mrs-modal-message");
    const confirmButton = document.getElementById("mrs-modal-confirm");
    const cancelButton = document.getElementById("mrs-modal-cancel");

    titleElement.textContent = title;
    messageElement.textContent = message;

    titleElement.style.color =
        type === "error" ? "#c62828" :
        type === "success" ? "#217a3c" : "#0b2a4a";

    cancelButton.style.display = "none";
    confirmButton.textContent = "OK";
    overlay.style.display = "flex";

    confirmButton.onclick = () => {
        overlay.style.display = "none";
    };
}

function showConfirmModal(title, message) {
    return new Promise((resolve) => {
        const overlay = document.getElementById("mrs-modal-overlay");
        const titleElement = document.getElementById("mrs-modal-title");
        const messageElement = document.getElementById("mrs-modal-message");
        const confirmButton = document.getElementById("mrs-modal-confirm");
        const cancelButton = document.getElementById("mrs-modal-cancel");

        titleElement.textContent = title;
        titleElement.style.color = "#0b2a4a";
        messageElement.textContent = message;

        cancelButton.style.display = "inline-block";
        cancelButton.textContent = "Cancel";
        confirmButton.textContent = "Delete";
        overlay.style.display = "flex";

        function finish(result) {
            overlay.style.display = "none";
            cancelButton.style.display = "none";
            confirmButton.onclick = null;
            cancelButton.onclick = null;
            resolve(result);
        }

        confirmButton.onclick = () => finish(true);
        cancelButton.onclick = () => finish(false);
    });
}


async function deleteAddress(event, addressId) {
    event.preventDefault();
    event.stopPropagation();

    const confirmed = await showConfirmModal(
    "Delete Address",
    "Are you sure you want to delete this address?"
);

    if (!confirmed) {
        return;
    }

    try {
        const response = await fetch(
            `${API_BASE_URL}/addresses/${encodeURIComponent(addressId)}`,
            {
                method: "DELETE",
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message || "Unable to delete address."
            );
        }

        if (selectedAddressId === addressId) {
            selectedAddressId = null;
        }

        await loadAddresses();

        showToast("Address deleted successfully.", "success");

    } catch (error) {
        console.error("Delete address error:", error);

        showToast(
            error.message || "Unable to delete address.",
            "error"
        );
    }
}

/* ================================
   ADDRESS FORM
================================ */

function showAddressForm() {

    document.getElementById(
        "address-form-container"
    ).style.display = "block";

}


function hideAddressForm() {

    document.getElementById(
        "address-form-container"
    ).style.display = "none";

}


/* ================================
   SAVE ADDRESS
================================ */

document
    .getElementById("address-form")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const addressData = {

                name:
                    document.getElementById(
                        "address-name"
                    ).value.trim(),

                phone:
                    document.getElementById(
                        "address-phone"
                    ).value.trim(),

                addressLine1:
                    document.getElementById(
                        "address-line1"
                    ).value.trim(),

                addressLine2:
                    document.getElementById(
                        "address-line2"
                    ).value.trim(),

                city:
                    document.getElementById(
                        "address-city"
                    ).value.trim(),

                state:
                    document.getElementById(
                        "address-state"
                    ).value.trim(),

                pincode:
                    document.getElementById(
                        "address-pincode"
                    ).value.trim(),

                landmark:
                    document.getElementById(
                        "address-landmark"
                    ).value.trim(),

                addressType:
                    document.getElementById(
                        "address-type"
                    ).value

            };


            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/addresses`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                Authorization:
                                    `Bearer ${token}`
                            },

                            body:
                                JSON.stringify(
                                    addressData
                                )
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Unable to save address"
                    );

                }


                hideAddressForm();


                await loadAddresses();


                showModal(
                "Success",
                "Address added successfully.",
                "success"
            );


            } catch (error) {

                console.error(
                    "Save address error:",
                    error
                );

                showModal(
                "Error",
                error.message || "Unable to save address.",
                "error"
            );

            }

        }
    );


    /* ================================
       TOAST NOTIFICATION
    ================================ */

    function showToast(message, type = "error") {

        const existingToast =
            document.querySelector(".toast");

        if (existingToast) {
            existingToast.remove();
        }

        const toast =
            document.createElement("div");

        toast.className =
            `toast ${type}`;

        toast.textContent = message;

        document.body.appendChild(toast);

        setTimeout(() => {

            toast.remove();

        }, 3000);
    }

/* ================================
   PLACE ORDER BUTTON
================================ */

function updatePlaceOrderButton() {

    const button =
        document.getElementById(
            "place-order-btn"
        );


    button.disabled =
        !selectedAddressId ||
        !cart ||
        !cart.items ||
        cart.items.length === 0;

}


/* ================================
   PLACE ORDER
================================ */

async function placeOrder() {

    if (!selectedAddressId) {

      showModal(
    "Delivery Address Required",
    "Please select a delivery address.",
    "error"
);

        return;
    }


    const paymentMethod =
        document.querySelector(
            'input[name="paymentMethod"]:checked'
        ).value;


    const button =
        document.getElementById(
            "place-order-btn"
        );


    button.disabled = true;

    button.textContent =
        "Processing...";


    try {

      if (paymentMethod === "COD") {
      await placeCODOrder();
    } else if (paymentMethod === "UPI") {
        await placeUpiOrder();
    } else if (paymentMethod === "ONLINE") {
        await startOnlinePayment();
    }

    } catch (error) {

        console.error(
            "Place order error:",
            error
        );

        showModal(
      "Order Error",
      error.message || "Unable to place order.",
      "error"
  );


        button.disabled = false;

        button.textContent =
            "Place Order";
    }

}


/* ================================
   COD
================================ */

async function placeCODOrder() {

    const response =
        await fetch(
            `${API_BASE_URL}/orders`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    Authorization:
                        `Bearer ${token}`
                },

                body: JSON.stringify({

                    addressId:
                        selectedAddressId,

                    paymentMethod:
                        "COD"

                })
            }
        );


    const result =
        await response.json();


    if (!response.ok) {

        throw new Error(
            result.message ||
            "Unable to place COD order"
        );

    }


    const order =
        result.data ||
        result.order ||
        result;


        if (!order._id) {
          throw new Error("Order was placed, but its ID was not returned.");
      }

      window.location.href =
          `order-success.html?orderId=${encodeURIComponent(order._id)}`;
}


/* ================================
   UPI ORDER
================================ */

async function placeUpiOrder() {
    const billingAddress = getBillingAddress();

    const response = await fetch(`${API_BASE_URL}/orders`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({
            addressId: selectedAddressId,
            paymentMethod: "UPI",
            billingAddress
        })
    });

    const result = await response.json();

    if (!response.ok) {
        throw new Error(
            result.message || "Unable to create UPI order"
        );
    }

    const order = result.data || result.order || result;

    if (!order._id) {
        throw new Error(
            "Order was created, but its ID was not returned."
        );
    }

    window.location.href =
    `/upi-payment?orderId=${encodeURIComponent(order._id)}`;
}

/* ================================
   ONLINE PAYMENT
================================ */

async function startOnlinePayment() {

    const response =
        await fetch(
            `${API_BASE_URL}/payments/create-order`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    Authorization:
                        `Bearer ${token}`
                },

                body: JSON.stringify({

                    addressId:
                        selectedAddressId

                })
            }
        );


    const result =
        await response.json();


    if (!response.ok) {

        throw new Error(
            result.message ||
            "Unable to create payment order"
        );

    }


    const paymentData =
        result.data ||
        result;


    const razorpayOptions = {

        key:
            paymentData.keyId,

        amount:
            paymentData.amount,

        currency:
            paymentData.currency || "INR",

        name:
            "MRS Enterprises",

        description:
            "MRS Enterprises Order",

        order_id:
            paymentData.razorpayOrderId,

handler:
  async function(paymentResponse) {
      await verifyPayment(paymentResponse);
  },

modal: {
  ondismiss: function () {
      const button =
          document.getElementById("place-order-btn");

      button.disabled = false;
      button.textContent = "Place Order";

      showToast(
          "Payment cancelled. You can try again.",
          "error"
      );
  }
},

        prefill: {

            name:
                paymentData.customerName || "",

            email:
                paymentData.customerEmail || "",

            contact:
                paymentData.customerPhone || ""

        },


        theme: {
            color: "#0b2a4a"
        }

    };


    const razorpay =
        new Razorpay(
            razorpayOptions
        );


        razorpay.on(
          "payment.failed",
          async function(response) {

              console.error(
                  "Razorpay payment failed:",
                  response
              );

              try {
                  const razorpayOrderId =
                      response.error?.metadata?.order_id;

                  if (razorpayOrderId) {

                      await fetch(
                          `${API_BASE_URL}/payments/failed`,
                          {
                              method: "POST",

                              headers: {
                                  "Content-Type":
                                      "application/json",

                                  Authorization:
                                      `Bearer ${token}`
                              },

                              body: JSON.stringify({
                                  razorpay_order_id:
                                      razorpayOrderId
                              })
                          }
                      );
                  }

              } catch (error) {

                  console.error(
                      "Failed to update payment failure:",
                      error
                  );
              }

              showToast(
              "Payment failed. Please try again.",
              "error"
          );

              const button =
                  document.getElementById(
                      "place-order-btn"
                  );

              button.disabled = false;

              button.textContent =
                  "Place Order";
          }
      );


    razorpay.open();

}


/* ================================
   VERIFY PAYMENT
================================ */

async function verifyPayment(paymentResponse) {
    try {
        const response = await fetch(
            `${API_BASE_URL}/payments/verify`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`
                },

                body: JSON.stringify({
                    razorpay_order_id:
                        paymentResponse.razorpay_order_id,

                    razorpay_payment_id:
                        paymentResponse.razorpay_payment_id,

                    razorpay_signature:
                        paymentResponse.razorpay_signature
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.message ||
                "Payment verification failed"
            );
        }

        const order = result.data || result.order || result;
  const orderId = order?._id || order?.orderId;

  if (!orderId) {
      throw new Error(
          "Payment was verified, but the order ID was not returned."
      );
  }

  window.location.href =
      `order-success.html?orderId=${encodeURIComponent(orderId)}`;

    } catch (error) {
        console.error(
            "Payment verification error:",
            error
        );

        showModal(
    "Payment Verification Failed",
    error.message || "Payment verification failed. Please try again.",
    "error"
);

        const button =
            document.getElementById(
                "place-order-btn"
            );

        button.disabled = false;
        button.textContent = "Place Order";
    }
}
