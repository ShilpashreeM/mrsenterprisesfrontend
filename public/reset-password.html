
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | MRS Enterprises</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .reset-section {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #17365d;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #0b5cab;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #reset-message {
            margin-top: 16px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        a {
            color: #0b5cab;
        }
    </style>
</head>
<body>

    <main class="reset-section">
        <section class="reset-card">
            <h1>Reset Your Password</h1>
            <p>Choose a new password for your MRS Enterprises account.</p>

            <form id="reset-password-form">
                <label for="new-password">New Password</label>
                <input
                    type="password"
                    id="new-password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirm-password">Confirm New Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button type="submit" id="reset-submit">
                    Reset Password
                </button>
            </form>

            <p id="reset-message" role="status" aria-live="polite"></p>
            <a id="login-link" href="login.html" hidden>Go to Login</a>
        </section>
    </main>

    <script src="api.js"></script>
    <script>
        const form = document.getElementById("reset-password-form");
        const message = document.getElementById("reset-message");
        const submitButton = document.getElementById("reset-submit");
        const loginLink = document.getElementById("login-link");

        // Read the token from the link in the email.
        const token = new URLSearchParams(window.location.search).get("token");

        if (!token) {
            message.textContent =
                "The reset link is missing or invalid. Please request a new one.";
            form.hidden = true;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            if (!token) return;

            const newPassword =
                document.getElementById("new-password").value;
            const confirmPassword =
                document.getElementById("confirm-password").value;

            if (newPassword.length < 8) {
                message.textContent =
                    "Password must be at least 8 characters.";
                return;
            }

            if (newPassword !== confirmPassword) {
                message.textContent = "The passwords do not match.";
                return;
            }

            submitButton.disabled = true;
            message.textContent = "Resetting your password...";

            try {
                const response = await fetch(
                    `${API_BASE_URL}/auth/reset-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ token, newPassword })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Unable to reset your password."
                    );
                }

                message.textContent =
                    "Password reset successfully. You can now log in.";
                form.hidden = true;
                loginLink.hidden = false;
            } catch (error) {
                console.error("Reset password error:", error);
                message.textContent =
                    error.message || "Unable to reset password. Please try again.";
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
