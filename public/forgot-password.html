
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Forgot Password | MRS Enterprises</title>

   <link rel="icon" type="image/png" href="images/MRS.png">
   <link rel="stylesheet" href="style.css">
   <link rel="stylesheet" href="footer.css">

    <style>
        .forgot-password-section {
            min-height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .forgot-password-card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .forgot-password-card h1 {
            margin-bottom: 12px;
            color: #17365d;
            font-size: 26px;
        }

        .forgot-password-card p {
            color: #555;
            line-height: 1.6;
        }

        .forgot-password-card label {
            display: block;
            margin: 20px 0 8px;
            font-weight: 600;
        }

        .forgot-password-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .forgot-password-card button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #0b5cab;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .forgot-password-card button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #forgot-password-message {
            margin-top: 16px;
            overflow-wrap: anywhere;
        }

        .back-to-login {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #0b5cab;
            text-decoration: none;
        }
    </style>
</head>
<body>


<header class="menu">
  <img src="images/MRS.png" class="logo" alt="Company Logo">

  <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="products.html">Our Products</a>
      <a href="contact.html">Contact Us</a>
  </nav>

  <div class="hamburger" onclick="openMenu()">&#9776;</div>
</header>

<div id="mobileMenu" class="mobile-menu">
  <div class="mobile-menu-header">
      <img src="images/MRS.png" class="mobile-logo" alt="MRS Enterprises">
      <span class="close-btn" onclick="closeMenu()">✕</span>
  </div>

  <a href="index.html">Home</a>
  <a href="about.html">About Us</a>
  <a href="products.html">Our Products</a>
  <a href="contact.html">Contact Us</a>
</div>

    <main class="forgot-password-section">
        <section class="forgot-password-card">
            <h1>Forgot Password?</h1>
            <p>
                Enter the email address associated with your
                MRS Enterprises account. If an account exists,
                we'll send you a password reset link.
            </p>

            <form id="forgot-password-form">
                <label for="forgot-email">Email Address</label>
                <input
                    type="email"
                    id="forgot-email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

                <button type="submit" id="forgot-submit">
                    Send Reset Link
                </button>
            </form>

            <p id="forgot-password-message" role="status" aria-live="polite"></p>

            <a href="login.html" class="back-to-login">
                Back to Login
            </a>
        </section>
    </main>

    <div id="footer-placeholder"></div>

<script>
fetch("footer.html")
    .then(res => res.text())
    .then(html => {
        document.getElementById("footer-placeholder").innerHTML = html;
    });
</script>

    <script src="api.js"></script>
    <script>
        const form = document.getElementById("forgot-password-form");
        const message = document.getElementById("forgot-password-message");
        const submitButton = document.getElementById("forgot-submit");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("forgot-email").value.trim();

            message.textContent = "Sending reset instructions...";
            submitButton.disabled = true;

            try {
                const response = await fetch(
                    `${API_BASE_URL}/auth/forgot-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ email })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || "Unable to process your request."
                    );
                }

                message.textContent =
                    result.message ||
                    "If an account exists with that email, reset instructions will be sent.";

                form.reset();
            } catch (error) {
                console.error("Forgot password error:", error);
                message.textContent =
                    error.message || "Unable to connect to the server. Please try again.";
            } finally {
                submitButton.disabled = false;
            }
        });

        function openMenu() {
            document.getElementById("mobileMenu").classList.add("open");
        }

        function closeMenu() {
            document.getElementById("mobileMenu").classList.remove("open");
        }
        
    </script>
</body>
</html>
